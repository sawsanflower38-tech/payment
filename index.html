<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Money Here</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:90%;
max-width:500px;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
width:90px;
height:90px;
border-radius:50%;
background:#e5eefb;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
}

h1{
text-align:center;
color:#0b57d0;
margin-top:15px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.box{
background:#f8f9fc;
padding:15px;
border-radius:12px;
margin-bottom:18px;
}

.label{
font-size:13px;
color:#777;
margin-bottom:6px;
}

.value{
font-size:17px;
font-weight:bold;
word-break:break-all;
}

button{
margin-top:10px;
width:100%;
padding:12px;
background:#0b57d0;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#0846a5;
}

.footer{
margin-top:25px;
text-align:center;
font-size:13px;
color:#666;
}

</style>

</head>
<body>

<div class="card">

<div class="logo">
🏦
</div>

<h1>Send Money Here</h1>

<div class="subtitle">
North Africa Bank
</div>

<div class="box">
<div class="label">Account Holder</div>
<div class="value">
SAWSAN SALEM EBSHIR
</div>
</div>

<div class="box">
<div class="label">Account Number</div>
<div class="value" id="account">
075031139686016
</div>

<button onclick="copyText('account')">
Copy Account Number
</button>
</div>

<div class="box">
<div class="label">Routing Number</div>
<div class="value" id="routing">
LY40007075075031139686016
</div>

<button onclick="copyText('routing')">
Copy Routing Number
</button>
</div>

<div class="footer">
Please verify all details before sending.
</div>

</div>

<script>

function copyText(id){

let text=document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

alert("Copied Successfully ✅");

}

</script>

</body>
</html>
